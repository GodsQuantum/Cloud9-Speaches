name: Cloud9-Speaches native portable candidate

on:
  pull_request:
    paths:
      - 'packaging/portable/**'
      - '.github/workflows/portable-desktop.yml'
      - 'src/speaches/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-app:
    name: 'Portable FastAPI+CrispASR / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'

      - name: Install authentic Speaches runtime and PyInstaller into private 3.12 environment
        shell: bash
        run: |
          uv sync --frozen --no-dev --python 3.12
          uv pip install --python .venv "pyinstaller==6.22.3" "pytest>=8.4,<9"
      - name: Ensure packaging Python is correct and test CPU runtime extraction
        shell: bash
        run: |
          uv run --no-sync python -m compileall -q packaging/portable
          uv run --no-sync python -m pytest -q --confcutdir=tests/reloaded tests/reloaded/test_cloud9_native_ctc.py
      - name: Bundle true Cloud9-Speaches FastAPI/Gradio and upstream CrispASR CPU
        shell: bash
        run: |
          uv run --no-sync python packaging/portable/build.py
      - name: Upload standalone candidate and checksum (unsigned, models download separately)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'cloud9-speaches-portable-${{ matrix.os }}'
          path: |
            packaging/portable/dist/*/Cloud9-Speaches-*.zip
            packaging/portable/dist/*/Cloud9-Speaches-*.dmg
            packaging/portable/dist/*/Cloud9-Speaches-*.sha256
          if-no-files-found: error
          retention-days: 10

# An API smoke with model availability checks is NOT acoustic certification.
# Runtime models are acquired separately with license/hash verification.
# Windows installer/signing and Apple Developer ID notarization are separate gates.
