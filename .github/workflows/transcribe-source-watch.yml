name: transcribe.cpp source watch
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare pinned transcribe.cpp with upstream
        id: check
        shell: bash
        run: |
          pinned="$(sed -n 's/^ARG TRANSCRIBE_REF=//p' Dockerfile | head -n1)"
          latest="$(python3 - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://api.github.com/repos/handy-computer/transcribe.cpp/commits/main',timeout=30) as r:
              print(json.load(r)['sha'])
          PY
          )"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          [ "$pinned" = "$latest" ] && echo 'changed=false' >> "$GITHUB_OUTPUT" || echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Open deduplicated review issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.check.outputs.pinned }}
          LATEST: ${{ steps.check.outputs.latest }}
        shell: bash
        run: |
          marker="transcribe-source-watch:$LATEST"
          existing="$(gh issue list --state open --limit 100 --json number,body --jq \".[] | select((.body // \\\"\\\") | contains(\\\"$marker\\\")) | .number\" | head -n1)"
          [ -n "$existing" ] && exit 0
          body="transcribe.cpp moved from $PINNED to $LATEST. Review changelog, rebuild Vulkan image, run STT regression/latency gates, then update TRANSCRIBE_REF. No automatic promotion.\n\n<!-- $marker -->"
          gh issue create --title "transcribe.cpp source update available" --body "$body"
