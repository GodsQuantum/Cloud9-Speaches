name: Cloud9 Vulkan release (immutable)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release version contract
        run: |
          python tests/reloaded_release_test.py
          grep -q 'ARG TRANSCRIBE_REF=f1dcd15858c4bbba87ca97862b4e448b2cf15b8f' Dockerfile

  publish-vulkan:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Authenticate to GHCR with repository token
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish isolated Vulkan image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            TRANSCRIBE_BACKEND=vulkan
            BASE_IMAGE=ubuntu:24.04
            TRANSCRIBE_BUILDER_IMAGE=ubuntu:24.04
            TRANSCRIBE_REF=f1dcd15858c4bbba87ca97862b4e448b2cf15b8f
          tags: ghcr.io/godsquantum/speaches-reloaded:cloud9-0.4.0-350bcc2-vulkan
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan
