name: test
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yaml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yaml"

env:
  DO_NOT_TRACK: 1
  GRADIO_ANALYTICS_ENABLED: "False"
  DISABLE_TELEMETRY: 1
  HF_HUB_DISABLE_TELEMETRY: 1
  PYANNOTE_METRICS_ENABLED: 0

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true
      - run: uv python install
      - run: uv sync
      - run: uv run pytest -m "not requires_openai and not requires_gated_hf_model" tests/
