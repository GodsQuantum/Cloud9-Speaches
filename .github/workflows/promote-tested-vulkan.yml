name: Promote tested Speaches Vulkan candidate to latest-vulkan
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact immutable candidate tag (sha-abcdefg-vulkan)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Validate immutable candidate name
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^sha-[a-f0-9]{7}-vulkan$ ]]
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote manifest without recompilation or local image build
        env:
          CANDIDATE: ${{ inputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          source_image="ghcr.io/godsquantum/speaches-reloaded:$CANDIDATE"
          target_image="ghcr.io/godsquantum/speaches-reloaded:latest-vulkan"
          docker buildx imagetools inspect "$source_image"
          docker buildx imagetools create --tag "$target_image" "$source_image"
          docker buildx imagetools inspect "$target_image"
          echo "$target_image promoted from $source_image" >> "$GITHUB_STEP_SUMMARY"
