name: Native backend portability smoke

on:
  push:
    branches: [main]
    paths:
      - "src/speaches/executors/cloud9_ctc.py"
      - "src/speaches/executors/cloud9_alignment_groups.py"
      - "src/speaches/executors/cloud9_word_alignment.py"
      - "tests/reloaded/test_cloud9_native_ctc.py"
      - ".github/workflows/native-backend-portability.yml"
  pull_request:
    paths:
      - "src/speaches/executors/cloud9_ctc.py"
      - "src/speaches/executors/cloud9_alignment_groups.py"
      - "src/speaches/executors/cloud9_word_alignment.py"
      - "tests/reloaded/test_cloud9_native_ctc.py"
      - ".github/workflows/native-backend-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-python-ctc:
    name: "Native CTC contract / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install only portable CTC API test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8.4,<9"
          "fastapi>=0.121,<1"
          "python-multipart>=0.0.20"
          "httpx>=0.28,<1"
          "soundfile>=0.13,<1"
          "langdetect==1.0.9"
      - name: Validate native CTC backend selection and strict acoustic contracts
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/reloaded/test_cloud9_native_ctc.py
      - name: Verify modules compile for the native host platform
        run: python -m compileall -q src/speaches/executors/cloud9_ctc.py src/speaches/executors/cloud9_alignment_groups.py

# The matrix validates Python/API portability, NOT presence of native GPU
# artifacts or CUDA/Vulkan/Metal acoustic performance. Hardware certification
# is separately mandatory before packaging/installers can claim support.
