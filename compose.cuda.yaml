services:
  speaches:
    extends:
      file: compose.yaml
      service: speaches
    image: ghcr.io/godsquantum/speaches-reloaded:latest-cuda
    environment:
      TRANSCRIBE_BACKEND: cuda
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-float16}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  speaches-models:
