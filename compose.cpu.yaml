services:
  speaches:
    extends:
      file: compose.yaml
      service: speaches
    image: ghcr.io/godsquantum/speaches-reloaded:latest-cpu
    environment:
      TRANSCRIBE_BACKEND: cpu
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER__CPU_THREADS: "${WHISPER_CPU_THREADS:-0}"

volumes:
  speaches-models:
